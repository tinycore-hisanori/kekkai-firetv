plugins {
    id "com.android.application"
}
android {
    namespace "com.tinylabo.kekkai"
    compileSdk 34
    defaultConfig {
        applicationId "com.tinylabo.kekkai"
        minSdk 22            // Fire OS 5 (Lollipop) and newer
        targetSdk 34
        versionCode 2
        versionName "1.2.1"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources {
        noCompress += ["html"]
    }
}
