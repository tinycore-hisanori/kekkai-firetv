<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KEKKAI — Seal the Yokai</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; }
  body {
    background:#0b0912;
    background-image: radial-gradient(ellipse at 50% -10%, #3a1830 0%, #0b0912 65%);
    color:#efe6d6; font-family: "Palatino Linotype", Georgia, "Yu Mincho", serif;
    user-select:none; -webkit-user-select:none; touch-action:none;
    display:flex; flex-direction:column;
  }
  header { display:flex; align-items:center; justify-content:space-between; padding:8px 14px 2px; width:100%; max-width:1100px; margin:0 auto; }
  .logo { font-size:20px; letter-spacing:6px; color:#ffd65a; text-shadow:0 0 10px rgba(255,190,60,.5); font-weight:bold; }
  .logo small { display:block; font-size:9px; letter-spacing:4px; color:#b08a9a; font-weight:normal; }
  #bossCount { font-size:11px; letter-spacing:3px; color:#b08a9a; text-align:center; }
  #bossCount b { display:block; font-size:16px; color:#fff; letter-spacing:2px; }
  button.ctrl { background:#231a2e; color:#e6d4ff; border:1px solid #4a3560; font-family:inherit; font-size:12px; padding:7px 12px; border-radius:6px; cursor:pointer; }
  #muteBtn, .langBtn { margin-left:6px; }

  #arena { flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; width:100%; max-width:1100px; margin:0 auto; padding:0 10px 8px; gap:6px; }
  #bossPane { width:100%; max-width:560px; display:flex; flex-direction:column; align-items:center; position:relative; flex:0 0 auto; }
  #boardPane { flex:1; min-height:0; width:100%; max-width:600px; display:flex; flex-direction:column; align-items:center; }

  .bar { height:9px; width:100%; background:#1a1322; border:1px solid #3a2a48; border-radius:5px; overflow:hidden; position:relative; }
  #bossStage { position:relative; width:100%; height:clamp(118px, 22vh, 220px); display:flex; align-items:flex-end; justify-content:center; }
  #foes { position:relative; width:100%; height:100%; display:flex; align-items:flex-end; justify-content:center; gap:4%; }
  .foe { position:relative; height:100%; flex:0 1 70%; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; min-width:0; }
  #foes.duo .foe { flex:0 1 48%; }
  .foeBar { position:absolute; top:0; left:50%; transform:translateX(-50%); width:min(100%, 250px); z-index:2;
            background:rgba(12,6,18,.72); border:1px solid #4a2a40; border-radius:8px; padding:3px 7px 5px; backdrop-filter:blur(2px); }
  .foeName { display:flex; align-items:baseline; gap:4px; font-size:12px; letter-spacing:1px; color:#ffb0d0; white-space:nowrap; overflow:hidden; margin-bottom:3px; }
  .foeName .jp { font-family:"Yu Mincho","Noto Serif JP",serif; color:#ff5a5a; }
  html[lang="ja"] .foeName .jp { display:none; }
  .foeName .hpTxt { margin-left:auto; font-size:10px; color:#b08a9a; }
  .foe .bar { height:7px; }
  .foe .hp { position:absolute; left:0; top:0; height:100%; width:100%; background:linear-gradient(90deg,#a01f3a,#ff4a6a); box-shadow:0 0 10px #ff3a5a; transition:width .25s; }
  .foe .lag { position:absolute; left:0; top:0; height:100%; width:100%; background:#fff3; transition:width .9s .25s; }
  #bossStage::before { content:""; position:absolute; bottom:4px; left:50%; transform:translateX(-50%); width:60%; height:26px; border-radius:50%; background:radial-gradient(ellipse, rgba(160,60,255,.45), transparent 70%); }
  .foe img { position:relative; height:72%; max-width:100%; object-fit:contain; filter:drop-shadow(0 0 14px rgba(170,60,255,.6)); animation:idle 2.6s ease-in-out infinite; transform-origin:50% 100%; }
  @keyframes idle { 0%,100% { transform:translateY(0) scale(1); } 50% { transform:translateY(-5px) scale(1.015); } }
  .foe img.hit { animation:hit .28s; filter:brightness(2.2) drop-shadow(0 0 20px #fff); }
  @keyframes hit { 0% { transform:translateX(-10px) scale(.96); } 50% { transform:translateX(8px); } 100% { transform:none; } }
  .foe img.windup { filter:drop-shadow(0 0 22px #ff3040) brightness(1.15); }
  .foe img.dead { animation:dead 1.4s forwards; }
  @keyframes dead { 0% { filter:brightness(3) saturate(0); } 100% { opacity:0; transform:scale(.4) translateY(-40px); filter:brightness(4) saturate(0); } }
  .foe img.enter { animation:enter .8s cubic-bezier(.2,1.4,.4,1); }
  @keyframes enter { 0% { opacity:0; transform:translateY(-60px) scale(1.3); } 100% { opacity:1; transform:none; } }

  #atk { width:100%; display:flex; align-items:center; gap:8px; font-size:12px; letter-spacing:1px; min-height:22px; }
  #atkName { white-space:nowrap; color:#ffdede; }
  #atkName b { color:#ff6a6a; }
  #atkBarWrap { flex:1; height:6px; background:#1a1322; border-radius:3px; overflow:hidden; border:1px solid #4a2030; }
  #atkBar { height:100%; width:0; background:linear-gradient(90deg,#ff9a3a,#ff2a3a); }

  #boardWrap { flex:1; min-height:0; width:100%; display:flex; align-items:center; justify-content:center; }
  canvas#cv { border-radius:12px; touch-action:none; box-shadow:0 0 40px rgba(120,40,200,.25); }
  #playerRow { width:100%; max-width:560px; display:flex; align-items:center; gap:10px; padding-top:6px; }
  #bars { flex:1; display:flex; flex-direction:column; gap:5px; font-size:10px; letter-spacing:2px; color:#b08a9a; }
  #bars .lab { display:flex; justify-content:space-between; }
  #lifeFill { height:100%; width:100%; background:linear-gradient(90deg,#2fbf6a,#8affb0); box-shadow:0 0 8px #3aff8a; transition:width .25s; }
  #reiFill { height:100%; width:0; background:linear-gradient(90deg,#d8a030,#ffe27a); box-shadow:0 0 8px #ffc840; transition:width .2s; }
  .spell { display:flex; align-items:center; gap:6px; background:#231a2e; border:1px solid #6a4a30; color:#ffe9b0; border-radius:10px; padding:5px 12px 5px 7px; cursor:pointer; font-family:inherit; font-size:11px; letter-spacing:1px; text-align:left; }
  .spell span.k { font-size:24px; line-height:1; color:#ffd65a; text-shadow:0 0 8px rgba(255,200,80,.6); font-family:"Yu Mincho","Noto Serif JP",serif; }
  .spell small { display:block; font-size:9px; color:#b08a9a; }
  .spell:disabled { opacity:.35; cursor:default; }
  .spell:not(:disabled) { box-shadow:0 0 10px rgba(255,200,80,.35); }
  .spell:not(:disabled):active { transform:scale(.95); }

  @media (min-aspect-ratio: 11/10) {
    #arena { flex-direction:row; align-items:stretch; justify-content:center; gap:22px; padding-top:6px; }
    #bossPane { width:40%; max-width:430px; justify-content:center; }
    #bossStage { height:clamp(150px, 40vh, 360px); }
    #boardPane { width:auto; flex:0 1 600px; }
  }

  #toast { position:absolute; left:50%; bottom:2px; transform:translateX(-50%); width:max-content; background:rgba(25,15,35,.95); color:#f4e6c8; border:1px solid #8a6a40; font-size:15px; line-height:1.45; padding:11px 18px; border-radius:10px; opacity:0; transition:opacity .35s; pointer-events:none; z-index:6; max-width:96%; text-align:center; box-shadow:0 0 20px rgba(0,0,0,.6); }
  #toast.show { opacity:1; }
  /* ---------- final battle ---------- */
  body { transition: background-color 1.5s; }
  body.final { background-color:#140306;
    background-image: radial-gradient(circle at 78% 12%, rgba(255,70,60,.55) 0, rgba(200,30,40,.25) 6%, transparent 16%),
                      radial-gradient(ellipse at 50% -10%, #5a0f1c 0%, #1a0508 60%, #0a0205 100%); }
  body.final .logo { color:#ff5a4a; text-shadow:0 0 14px rgba(255,40,40,.8); }
  body.final #bossStage::before { background:radial-gradient(ellipse, rgba(255,40,40,.55), transparent 70%); }
  body.final .foe img { filter:drop-shadow(0 0 18px rgba(255,40,60,.75)); }
  .foe img.awake { animation:awake 1.1s ease-in-out infinite; filter:drop-shadow(0 0 26px #ff2030) drop-shadow(0 0 8px #fff) saturate(1.4) !important; }
  @keyframes awake { 0%,100% { transform:scale(1.18); } 50% { transform:scale(1.24) translateY(-4px); } }
  .foe img.crumble { animation:crumble .08s linear infinite; filter:drop-shadow(0 0 24px #b030ff) brightness(1.3) contrast(1.3) !important; }
  @keyframes crumble { 0% { transform:translate(-4px,2px) scale(1.2); } 25% { transform:translate(5px,-3px) scale(1.2); } 50% { transform:translate(-3px,-2px) scale(1.21); } 75% { transform:translate(4px,3px) scale(1.2); } 100% { transform:translate(-4px,2px) scale(1.2); } }
  #gogo { position:fixed; z-index:14; pointer-events:none; transform:translate(-50%,-50%) rotate(-8deg); font-family:"Hiragino Kaku Gothic StdN","Yu Gothic",system-ui,sans-serif; font-weight:900;
          font-size:clamp(34px, 7vw, 72px); color:#c040ff; -webkit-text-stroke:2px #1a0020; text-shadow:0 0 18px #8020ff, 4px 4px 0 #000; letter-spacing:.05em; white-space:nowrap; opacity:0; }
  #gogo.show { animation:gogo 2s steps(2) forwards; }
  @keyframes gogo { 0% { opacity:0; transform:translate(-50%,-50%) rotate(-8deg) scale(.6); } 10% { opacity:1; transform:translate(-50%,-50%) rotate(-8deg) scale(1.05); }
                    30% { transform:translate(-48%,-52%) rotate(-7deg) scale(1.08); } 60% { transform:translate(-52%,-48%) rotate(-9deg) scale(1.12); } 100% { opacity:1; transform:translate(-50%,-50%) rotate(-8deg) scale(1.2); } }
  #ending { position:fixed; inset:0; z-index:18; display:none; background:#120a1c; }
  #endCv { position:absolute; inset:0; touch-action:none; }
  #endSkip { position:absolute; right:14px; top:12px; z-index:2; }
  #endHint { position:absolute; left:50%; top:14px; transform:translateX(-50%); font-size:12px; letter-spacing:2px; color:#ffe9b0; text-shadow:0 0 6px #000; pointer-events:none; opacity:.85; }
  #endCard { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) scale(.9); opacity:0; pointer-events:none; transition:opacity 1s, transform 1s;
             text-align:center; padding:26px 34px; background:rgba(18,10,28,.78); border:1px solid #e8b04a; border-radius:16px; box-shadow:0 0 50px rgba(255,190,60,.3); width:min(92vw,520px); }
  #endCard.show { opacity:1; pointer-events:auto; transform:translate(-50%,-50%) scale(1); }
  #endCard .et { font-size:clamp(24px,5vw,34px); letter-spacing:.2em; color:#ffe27a; text-shadow:0 0 16px rgba(255,200,80,.7); margin-bottom:10px; }
  #endCard .em { font-size:15px; line-height:1.6; color:#f4e6c8; margin-bottom:8px; }
  #endCard .etime { font-size:13px; color:#9ffcff; margin-bottom:6px; }
  #endCard .ethanks { font-size:16px; color:#ffb0d0; margin-bottom:16px; }
  #endCard .ebtns { display:flex; gap:10px; justify-content:center; align-items:center; flex-wrap:wrap; }
  #endCard .ecredit { margin-top:14px; font-size:10px; color:#8a755a; letter-spacing:1px; }
  #flash { position:fixed; inset:0; pointer-events:none; z-index:20; opacity:0; background:#fff; }
  #finalIntro { position:fixed; inset:0; z-index:15; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.92); pointer-events:none; }
  #finalIntro .fin { text-align:center; }
  #finalIntro .fk { font-family:"Yu Mincho","Noto Serif JP",serif; font-weight:900; font-size:clamp(64px, 16vw, 150px); color:#e8231f; letter-spacing:.12em;
                    text-shadow:0 0 30px rgba(255,20,20,.9), 0 0 4px #000; opacity:0; }
  #finalIntro .fsub { font-size:clamp(16px, 3.4vw, 28px); letter-spacing:.6em; color:#ffd6a0; opacity:0; margin-top:6px; }
  #finalIntro .fnames { margin-top:20px; font-family:"Yu Mincho","Noto Serif JP",serif; font-size:clamp(26px, 6vw, 48px); color:#fff; opacity:0; }
  #finalIntro .fnames i { font-style:normal; color:#e8231f; margin:0 .5em; }
  #finalIntro.play .fk { animation:fk 3.8s ease-out forwards; }
  #finalIntro.play .fsub { animation:fin 3.8s ease-out .5s forwards; }
  #finalIntro.play .fnames { animation:fin 3.8s ease-out 1.9s forwards; }
  #finalIntro.play { animation:fbg 3.8s forwards; }
  @keyframes fk { 0% { opacity:0; transform:scale(2.4); filter:blur(12px); } 12% { opacity:1; transform:scale(1); filter:blur(0); } 50% { transform:scale(1.03); } 88% { opacity:1; } 100% { opacity:0; } }
  @keyframes fin { 0% { opacity:0; transform:translateY(10px); } 15% { opacity:1; transform:none; } 80% { opacity:1; } 100% { opacity:0; } }
  @keyframes fbg { 0%,85% { background:rgba(0,0,0,.92); } 100% { background:rgba(0,0,0,0); } }
  #finalSeal { position:fixed; inset:0; z-index:16; display:none; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; }
  #finalSeal .fs1 { font-family:"Yu Mincho","Noto Serif JP",serif; font-weight:900; font-size:clamp(120px, 30vw, 260px); color:#fff5dc; background:#c8201c;
                    width:1.3em; height:1.3em; line-height:1.3em; text-align:center; border-radius:.12em; box-shadow:0 0 60px rgba(255,60,40,.9); opacity:0; }
  #finalSeal .fs2 { margin-top:24px; font-size:clamp(20px, 4.5vw, 38px); letter-spacing:.35em; color:#ffe27a; text-shadow:0 0 18px rgba(255,190,60,.9); opacity:0; }
  #finalSeal.play .fs1 { animation:stamp 3.4s ease-out forwards; }
  #finalSeal.play .fs2 { animation:fin 3.4s ease-out .8s forwards; }
  @keyframes stamp { 0% { opacity:0; transform:scale(3) rotate(-20deg); } 14% { opacity:1; transform:scale(.92) rotate(-8deg); } 20% { transform:scale(1) rotate(-8deg); } 85% { opacity:1; } 100% { opacity:0; transform:scale(1.05) rotate(-8deg); } }
  #bossCount, #bossCount b { white-space:nowrap; }
  header > div:last-child { display:flex; flex-wrap:nowrap; }
  @media (max-width: 520px) {
    header { padding:6px 8px 2px; }
    .logo { font-size:16px; letter-spacing:3px; }
    .logo small { display:none; }
    #bossCount { font-size:9px; letter-spacing:1px; }
    #bossCount b { font-size:13px; }
    button.ctrl { padding:6px 7px; font-size:11px; }
    #muteBtn, .langBtn { margin-left:3px; }
    header .ctrl + .ctrl { margin-left:3px; }
  }
  #tutor { position:absolute; left:50%; bottom:2px; transform:translateX(-50%); width:min(96%, 520px); z-index:8;
           background:rgba(30,18,10,.96); border:2px solid #e8b04a; border-radius:12px; padding:10px 16px 10px; text-align:center;
           box-shadow:0 0 24px rgba(255,190,60,.35); display:none; }
  #tutor.show { display:block; animation:tutIn .35s ease-out; }
  @keyframes tutIn { from { opacity:0; transform:translate(-50%, 10px); } to { opacity:1; transform:translate(-50%, 0); } }
  #tutor .tstep { font-size:11px; letter-spacing:3px; color:#e8b04a; margin-bottom:4px; }
  #tutor .ttext { font-size:15px; line-height:1.5; color:#fff5dc; }
  #tutor .ttext b { color:#ffd65a; }
  #skipTut { position:absolute; right:8px; top:6px; background:none; border:none; color:#9a8070; font-size:10px; letter-spacing:1px; cursor:pointer; font-family:inherit; }
  .selPanel { width:min(94vw, 760px); max-height:90vh; overflow:auto; position:relative; }
  #selClose { position:absolute; right:12px; top:12px; }
  #selGrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; margin-top:8px; }
  .card { background:#231a2e; border:1px solid #4a3560; border-radius:10px; padding:8px 8px 10px; cursor:pointer; color:#efe6d6; font-family:inherit; display:flex; flex-direction:column; align-items:center; gap:3px; transition:transform .12s; }
  .card:hover:not(.locked) { transform:translateY(-2px); border-color:#e8b04a; }
  .card.tut { border-color:#e8b04a; background:#2e2214; }
  .card.done { border-color:#3a8a5a; }
  .card.locked { opacity:.4; cursor:default; }
  .card .cimgs { height:74px; display:flex; align-items:flex-end; justify-content:center; gap:2px; }
  .card .cimgs img { height:100%; max-width:70px; object-fit:contain; filter:drop-shadow(0 0 6px rgba(170,60,255,.6)); }
  .card.locked .cimgs img { filter:brightness(0) drop-shadow(0 0 4px #555); }
  .card .cnum { font-size:11px; letter-spacing:3px; color:#e8b04a; }
  .card .cname { font-size:12px; color:#ffb0d0; min-height:16px; line-height:1.3; }
  .card .cstat { font-size:12px; color:#8affb0; min-height:16px; }
  @media (max-aspect-ratio: 11/10) {
    #toast, #tutor { position:fixed; top:auto; bottom:76px; width:94%; max-width:520px; font-size:14px; z-index:7; }
  }
  #toast b { color:#ffd65a; }
  #fx { position:fixed; inset:0; pointer-events:none; z-index:4; }
  #banner { position:fixed; left:0; right:0; top:42%; text-align:center; pointer-events:none; z-index:5; font-size:clamp(34px,8vw,72px); letter-spacing:10px; font-weight:bold; color:#ffd65a; text-shadow:0 0 24px rgba(255,180,40,.9), 0 0 4px #000; opacity:0; }
  #banner.show { animation:banner 1.3s ease-out; }
  @keyframes banner { 0% { opacity:0; transform:scale(1.8); } 15% { opacity:1; transform:scale(1); } 75% { opacity:1; } 100% { opacity:0; transform:scale(.95); } }
  .dmg { position:fixed; pointer-events:none; z-index:6; font-weight:bold; font-size:26px; color:#fff; text-shadow:0 0 8px #ff3a5a, 0 2px 0 #000; animation:dmg .9s ease-out forwards; font-family:system-ui,sans-serif; }
  .dmg.big { font-size:44px; color:#ffe27a; text-shadow:0 0 14px #ffa020, 0 2px 0 #000; }
  .dmg.hurt { color:#ff7070; text-shadow:0 0 8px #000; font-size:24px; }
  @keyframes dmg { 0% { opacity:0; transform:translate(-50%,0) scale(.6); } 20% { opacity:1; transform:translate(-50%,-14px) scale(1.15); } 100% { opacity:0; transform:translate(-50%,-60px) scale(1); } }
  #hurtFlash { position:fixed; inset:0; pointer-events:none; z-index:3; box-shadow:inset 0 0 120px rgba(255,0,40,.0); transition:box-shadow .15s; }
  #hurtFlash.on { box-shadow:inset 0 0 140px rgba(255,0,40,.75); }

  .ov { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(8,5,14,.86); z-index:10; backdrop-filter:blur(3px); }
  .panel { text-align:center; padding:28px 36px; border:1px solid #8a6a40; border-radius:14px; background:#1a1224; box-shadow:0 0 50px rgba(255,190,60,.18); max-width:94vw; }
  .panel h2 { color:#ffd65a; font-size:30px; letter-spacing:6px; margin-bottom:10px; text-shadow:0 0 16px rgba(255,200,80,.6); }
  .panel p { font-size:15px; color:#e6d4ff; margin-bottom:22px; line-height:1.6; }
  .big { background:linear-gradient(180deg,#e0442e,#a8201c); color:#fff5dc; border:none; font-family:inherit; font-weight:bold; font-size:16px; letter-spacing:4px; padding:13px 38px; border-radius:8px; cursor:pointer; box-shadow:0 0 18px rgba(230,70,40,.5); }
  #title { display:flex; }
  #title .jp { font-family:"Yu Mincho","Noto Serif JP",serif; font-size:20px; color:#d6282d; letter-spacing:8px; }
  #title h1 { font-size:clamp(44px,10vw,68px); letter-spacing:14px; color:#ffd65a; text-shadow:0 0 24px rgba(255,190,60,.6); }
  #title .tag { font-size:11px; letter-spacing:4px; color:#b08a9a; margin-bottom:16px; }
  #title img { height:150px; filter:drop-shadow(0 0 16px rgba(170,60,255,.7)); margin-bottom:8px; }
  #title .rule { font-size:18px; color:#fff; margin-bottom:6px; }
  #title .rule b { color:#ffd65a; }
  #title .sub { font-size:13px; color:#b08a9a; margin-bottom:22px; }
  #ver { margin:12px auto 0; font-size:11px; color:#6a5a7a; letter-spacing:1px; cursor:default; user-select:none; display:block; width:max-content; padding:4px 8px; }
  #credit { font-size:10px; color:#6a5a7a; margin-top:16px; letter-spacing:1px; }
</style>
</head>
<body>
<header>
  <div class="logo">KEKKAI<small data-i="tagline">SEAL THE YOKAI</small></div>
  <div id="bossCount"><span data-i="yokai">YOKAI</span><b id="bossNum">1 / 5</b></div>
  <div><button class="ctrl" id="selBtn">☰</button><button class="ctrl" id="resetBtn" data-i="board">↺ BOARD</button><button class="ctrl langBtn">EN</button><button class="ctrl" id="muteBtn">♪</button></div>
</header>

<main id="arena">
  <section id="bossPane">
    <div id="bossStage"><div id="foes"></div><div id="toast"></div><div id="tutor"><div class="tstep"></div><div class="ttext"></div><button id="skipTut" data-i="skip">SKIP</button></div></div>
    <div id="atk"><span id="atkName">…</span><div id="atkBarWrap"><div id="atkBar"></div></div></div>
  </section>
  <section id="boardPane">
    <div id="boardWrap"><canvas id="cv"></canvas></div>
    <div id="playerRow">
      <div id="bars">
        <div><div class="lab"><span data-i="life">LIFE</span><span id="lifeTxt">100</span></div><div class="bar"><div id="lifeFill"></div></div></div>
        <div><div class="lab"><span data-i="spirit">SPIRIT</span><span id="reiTxt">0</span></div><div class="bar"><div id="reiFill"></div></div></div>
      </div>
      <button class="spell" id="bindBtn"><span class="k">縛</span><span><span data-i="bind">BIND</span><small data-i="bindSub"></small></span></button>
      <button class="spell" id="purgeBtn"><span class="k">祓</span><span><span data-i="purge">PURGE</span><small data-i="purgeSub"></small></span></button>
    </div>
